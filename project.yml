name: MoreClock
options:
  bundleIdPrefix: com.skyviiew
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  MoreClockKit:
    path: Packages/MoreClockKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES

targets:
  MoreClock:
    type: application
    platform: macOS
    sources:
      - path: MoreClock
        excludes:
          - Info.plist
          - MoreClock.entitlements
    dependencies:
      - package: MoreClockKit
    info:
      path: MoreClock/Info.plist
      properties:
        CFBundleDisplayName: MoreClock
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "6"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: ""
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: MoreClock/MoreClock.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyviiew.MoreClock
        PRODUCT_NAME: MoreClock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ad-hoc "Sign to Run Locally". Set DEVELOPMENT_TEAM and CODE_SIGN_STYLE: Automatic to distribute.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  MoreClock:
    build:
      targets:
        MoreClock: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: MoreClockKit/MoreClockKitTests
